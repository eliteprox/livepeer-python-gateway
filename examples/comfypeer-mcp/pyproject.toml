[project]
name = "comfypeer-mcp"
version = "0.1.0"
description = "Local ComfyPeer MCP client for livepeer-python-gateway — auth via PymtHouse, discovery, live-runner/BYOC/LV2V execution."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "livepeer-gateway",
    "mcp[cli]>=1.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
comfypeer-mcp = "comfypeer_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfypeer_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/comfypeer_mcp" = "comfypeer_mcp"

# Prefer the parent package when developing inside this monorepo.
[tool.uv.sources]
livepeer-gateway = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
